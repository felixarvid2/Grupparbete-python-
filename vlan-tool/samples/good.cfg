!
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-Nordvik-2
!
no ip domain-lookup
ip domain-name nordvik.example
ip ssh version 2
!
username drift secret CHANGE_ME
!
spanning-tree mode rapid-pvst
!
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 30
 name GAST
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
interface FastEthernet0/1
 description PC-KONTOR
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description PC-EKONOMI
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description PC-GAST
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/4
 description PC-DRIFT
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/24
 description Uplink till SW-Nordvik-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99,999
!
interface Vlan99
 description Hantering
 ip address 192.168.1.195 255.255.255.192
 no shutdown
!
ip default-gateway 192.168.1.193
!
logging buffered 16384
logging host 192.168.1.17
!
ntp server 192.168.1.16
!
line con 0
 logging synchronous
line vty 0 15
 transport input ssh
 login local
!
end