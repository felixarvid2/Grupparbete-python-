!
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-Nordvik-1
!
no ip domain-lookup
ip domain-name nordvik.example
ip ssh version 2
!
username drift secret CHANGE_ME
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 30
 name GAST
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
interface Gi0/0
 description Port mot R-Nordvik-1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface Gi0/1
 description Port mot SW-Nordvik-2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
logging buffered 16384
logging host 192.168.1.17
ntp server 192.168.1.16
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
