!
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-Nordvik-1
!
no ip domain-lookup
ip domain-name nordvik.example
ip ssh version 2
!
username drift secret CHANGE_ME
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 30
 name GAST
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
interface vlan 99
 ip address 192.168.1.196 255.255.255.192
 no shutdown
!
ip default-gateway 192.168.1.193
!
interface Gi0/1
 description Port mot R-Nordvik-1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface Gi0/2
 description Port mot SW-Nordvik-2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface Fa0/1
 description Port mot AccessPoint
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Fa0/2
 description Port mot NTP-server
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
logging buffered 16384
logging host 192.168.1.17
ntp server 192.168.1.16
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
line vty 5 15
 transport input ssh
 login local
!
end
